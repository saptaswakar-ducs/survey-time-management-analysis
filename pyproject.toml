[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmsurvey"
version = "1.0.0"
description = "Descriptive and inferential analysis of a student time-management mini-survey"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "matplotlib>=3.9", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
